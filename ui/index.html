<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StickTresor</title>
<style>
:root{
  --mag:#1F6FB2; --mag-btn:#1C65A2; --mag-btn-h:#185689; --mag-text:#154C79; --mag-deep:#103A5D; --mag-soft:#E4EEF7; --mag-softer:#F6F9FC;
  --ink:#1C1A1E; --ink2:#3A3540; --muted:#5F5966; --line:#E6E1E9; --line2:#D4CDD8; --bg:#F6F5F7; --panel:#FFFFFF; --row:#F7F5F8;
  --warn-bg:#FFF5E6; --warn-ink:#6B3D00; --err-bg:#FDECEC; --err-ink:#8A1C1C; --ok-ink:#1F6B3A;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
a{color:var(--mag-btn-h)}
.mono{font-family:"Cascadia Mono",Consolas,"Courier New",monospace}
.muted{color:var(--muted)}
.small{font-size:12px}
.hidden{display:none!important}

/* Buttons & Felder */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:#fff;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:#F6F2F7;border-color:#BDB4C2}
.btn.p{background:var(--mag-btn);border-color:var(--mag-btn);color:#fff;font-weight:600}
.btn.p:hover{background:var(--mag-btn-h)}
.btn.g{border-color:transparent;background:transparent;color:#4A4450;min-height:34px;padding:0 10px;font-size:13px}
.btn.g:hover{background:#F1EDF3;color:var(--ink)}
.btn.danger{color:#A11B1B}
.btn.danger:hover{background:var(--err-bg);border-color:#E9B8B8}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{flex-shrink:0}
.field{width:100%;height:42px;border:1px solid var(--line2);border-radius:8px;padding:0 12px;background:#fff}
textarea.field{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:1.45}
.field:focus,.btn:focus-visible,.nav:focus-visible{outline:2px solid var(--mag);outline-offset:1px}
label.lbl{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.err{background:var(--err-bg);color:var(--err-ink);border-radius:8px;padding:10px 12px;font-size:13px}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:10px 12px;font-size:13px}
.info{background:#F1EDF3;color:var(--ink2);border-radius:8px;padding:10px 12px;font-size:13px}
.hint-mag{background:var(--mag-soft);color:var(--mag-deep);border-radius:10px;padding:12px 14px;font-size:13px}

/* Karten (Start, Passwort festlegen) */
.center{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.card{width:100%;max-width:440px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:36px 34px 26px;box-shadow:0 12px 40px rgba(40,10,30,.08);display:flex;flex-direction:column;gap:18px}
.card.wide{max-width:620px}
.card .logo{width:190px;align-self:center}
.card h1{font-size:22px;font-weight:700}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mag-btn-h)}
.keybox{border:1px dashed var(--mag);background:var(--mag-softer);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.keybox .key{font-size:20px;letter-spacing:.04em;word-break:break-all}
.cardfoot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid #EEEAF0;padding-top:12px;font-size:12px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:#EEEAF0;overflow:hidden}
.meter>div{height:100%;width:0;background:#C0392B;transition:width .2s}

/* Hauptfenster */
#app{min-height:100vh;display:flex;flex-direction:column}
#main{flex:1;display:flex;flex-direction:column}
.banner{background:var(--mag);color:#fff;padding:7px 20px;font-size:13px;font-weight:600;display:flex;gap:10px;flex-wrap:wrap}
.banner span+span{font-weight:400;opacity:.95}
header.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top img{height:34px}
.apptitle{display:flex;flex-direction:column;line-height:1.2;flex:1;min-width:160px}
.apptitle b{font-size:15px}
.body{flex:1;display:flex;flex-wrap:wrap;align-items:stretch;min-height:0}
nav.side{flex:1 1 250px;max-width:300px;min-width:230px;background:#fff;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:3px}
.sidehead{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px;display:flex;align-items:center;gap:6px}
.sidehead:first-of-type{padding-top:6px}
.sidehead .btn{min-height:26px;padding:0 6px;margin-left:auto;text-transform:none;letter-spacing:0}
.nav{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--ink2);text-align:left;cursor:pointer}
.nav:hover{background:#F1EDF3}
.nav.on{background:var(--mag-soft);color:var(--mag-text);font-weight:600}
.nav .two{display:flex;flex-direction:column;line-height:1.25;padding:6px 0;min-width:0}
.nav .two span:last-child{font-size:12px;font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .count{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
.empty-side{padding:6px 12px;color:var(--muted);font-size:13px}
main.content{flex:999 1 560px;min-width:0;padding:24px 28px 40px;display:flex;flex-direction:column;gap:18px}
.pagehead{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.pagehead .t{flex:1;min-width:220px;display:flex;flex-direction:column;gap:3px}
.pagehead h1{font-size:26px;font-weight:700;overflow-wrap:anywhere}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
section.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
section.box.accent{border-color:var(--mag)}
section.box.tint{background:var(--mag-softer);border-color:var(--mag)}
section.box h2{font-size:14px;font-weight:700}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:7px 10px;background:var(--row);border-radius:6px;align-items:baseline}
.kv.edit{background:transparent;padding:2px 0;align-items:center}
.kv .v.row{display:flex;align-items:center}
.sheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.sheetcol{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:900px){.sheet{grid-template-columns:1fr}}
.kv .k{color:var(--muted);font-size:13px}
.kv .v{font-weight:500;overflow-wrap:anywhere;white-space:pre-line}
.kv.multi{grid-template-columns:1fr}
.list{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pw{display:flex;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid #EEEAF0;flex-wrap:wrap}
.pw:last-child{border-bottom:0}
.pw .ic{width:36px;height:36px;border-radius:9px;background:var(--mag-soft);color:var(--mag-text);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pw .main{flex:1 1 220px;min-width:0;display:flex;flex-direction:column}
.pw .main b{overflow-wrap:anywhere}
.pw .main span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.pw .secret{flex:0 1 210px;min-width:120px;overflow-wrap:anywhere}
.pw .acts{display:flex;gap:2px;flex-wrap:wrap}
.emptybox{padding:28px 18px;text-align:center;color:var(--muted)}
footer.foot a{color:inherit}
footer.foot{background:#fff;border-top:1px solid var(--line);padding:9px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
footer.foot img{height:20px}
.legend{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Kopfzeile ohne Seitenmenü */
.logo-btn{border:0;background:transparent;padding:0;cursor:pointer;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;font-size:17px;color:var(--ink);letter-spacing:-.01em;white-space:nowrap}
.brand .m{color:var(--mag)}
.brand.big{font-size:24px}
footer .brand{font-size:12px;font-weight:600}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:10px}
.tab{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:0;border-radius:8px;background:transparent;color:var(--ink2);font-weight:500;cursor:pointer}
.tab:hover{background:#F1EDF3}
.tab.on{background:var(--mag-soft);color:var(--mag-text);font-weight:600}
.btn.icon{width:40px;padding:0}
.btn.icon.on{background:var(--mag-soft);border-color:var(--mag);color:var(--mag-text)}
main.content{flex:1;width:100%;max-width:1400px;margin:0 auto}
/* Startseite */
.home{display:flex;flex-direction:column;gap:20px;align-items:center;padding:12px 0 8px}
.infocard{width:100%;max-width:640px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px 34px;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center;box-shadow:0 12px 40px rgba(40,10,30,.06)}
.homelogo{width:260px;max-width:80%}
.infogrid{display:flex;gap:48px;justify-content:center;flex-wrap:wrap;font-size:15px;line-height:1.6}
.helpdesk{width:100%;background:var(--mag-softer);border:1px solid var(--mag);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px;align-items:center}
.hdnum{font-size:26px;font-weight:700;letter-spacing:.02em;color:var(--ink)}
.tiles{width:100%;max-width:1100px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.tile{display:flex;gap:16px;align-items:center;text-align:left;padding:22px 24px;background:#fff;border:1px solid var(--line);border-radius:14px;cursor:pointer;min-height:96px}
.tile:hover{border-color:var(--mag);background:var(--mag-softer)}
.tile b{display:block;font-size:18px}
.tile .muted{display:block;font-size:13px}
.tic{width:56px;height:56px;border-radius:14px;background:var(--mag-soft);color:var(--mag-text);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tic.small{width:40px;height:40px;border-radius:10px}
.devgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.devcard{display:flex;gap:14px;align-items:flex-start;text-align:left;padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.devcard:hover{border-color:var(--mag);background:var(--mag-softer)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border:1px solid var(--line2);border-radius:999px;background:#fff;cursor:pointer;font-weight:500}
.chip span{color:var(--muted);font-weight:400;font-size:12px}
.chip:hover{border-color:#BDB4C2;background:#F6F2F7}
.chip.on{background:var(--mag-soft);border-color:var(--mag);color:var(--mag-text);font-weight:600}
.chip.add{border-style:dashed;color:var(--muted)}
.chip svg{margin-right:2px}
.chiplabel{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);align-self:center;margin-right:4px}
.catrow{display:flex;gap:8px;align-items:center}
.catrow .field{height:38px}

/* Passwort-Tabelle */
.gridwrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto}
table.grid{width:100%;border-collapse:collapse;table-layout:fixed;min-width:1100px}
table.grid.prev{table-layout:auto;min-width:0}
.grid th{position:sticky;top:0;z-index:1;background:#F7F5F8;text-align:left;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);padding:0;white-space:nowrap}
.grid th>button{all:unset;display:block;box-sizing:border-box;width:100%;padding:10px;cursor:pointer}
.grid th>button:hover{color:var(--ink)}
.grid td{border-bottom:1px solid #EEEAF0;border-right:1px solid #F1EDF3;padding:0;height:38px;position:relative;background:#fff}
.grid tr:hover td{background:#FCFBFD}
.grid tr.active td{background:#FFF9FC}
.grid td:focus-within{box-shadow:inset 0 0 0 2px var(--mag);background:#fff!important}
.grid .cell{display:block;width:100%;height:38px;border:0;background:transparent;padding:0 10px;font:inherit;box-sizing:border-box;outline:none;color:var(--ink);text-overflow:ellipsis}
.grid select.cell{padding:0 6px;cursor:pointer}
.pwcell .cell{padding-right:62px}
.grid tr:hover .pwcell .cell,.grid tr.active .pwcell .cell{padding-right:122px}
.cbtns{position:absolute;right:4px;top:5px;display:flex;gap:2px;opacity:0}
.grid tr:hover .cbtns,.grid tr.active .cbtns,.grid tr:hover .racts .cbtn,.grid tr.active .racts .cbtn{opacity:1}
.cbtn{width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:#4A4450;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.cbtn:hover{background:var(--mag-soft);color:var(--mag-text)}
.racts{white-space:nowrap;text-align:center;border-right:0!important}
.racts .cbtn{opacity:0}
.grid tr.saving td:first-child{box-shadow:inset 3px 0 0 #D68910}
.grid tr.saved td:first-child{box-shadow:inset 3px 0 0 #1E8449}
.grid tr.rowerr td{background:var(--err-bg)!important}
.dialog.wide{max-width:900px}
.dialog.xwide{max-width:1180px}
.nlgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
.nlintro{margin:0;padding-left:18px;color:#4A4450;font-size:13px;display:flex;flex-direction:column;gap:4px}
details.nlbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
details.nlbox summary{cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:center}
details.nlhint{font-size:13px;color:#4A4450;background:var(--mag-softer);border-left:3px solid var(--mag);border-radius:0 8px 8px 0;padding:6px 12px}
details.nlhint summary{cursor:pointer;font-weight:600;color:var(--mag-text)}
details.nlhint ul{margin:6px 0 2px;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.nltable{overflow-x:auto}
table.nl{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;min-width:860px}
table.nl th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:4px 6px;border-bottom:1px solid var(--line)}
table.nl td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.nl tr.off td{opacity:.5}
table.nl tr.off td.nlck{opacity:1}
table.nl .field{height:34px;font-size:13px;padding:0 8px}
table.nl .nlck{width:28px}
table.nl .nlck input{width:17px;height:17px;accent-color:var(--mag-btn)}
table.nl .nlx{width:44px;text-align:right}
table.nl .nlmove{width:34px;padding:0 4px;color:transparent;background:transparent;border-color:transparent;cursor:pointer;background-image:none}
table.nl .nlmove:hover,table.nl .nlmove:focus{border-color:var(--line2)}
table.nl td.nlx{position:relative}
table.nl td.nlx:has(.nlmove)::after{content:"⇄";position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
table.nl .nlmove option{color:var(--ink)}
.updnotes{white-space:pre-wrap;margin-top:6px;max-height:160px;overflow:auto;font-size:13px}
.ok{color:var(--ok-ink);font-weight:600}
.pfgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);gap:22px;align-items:start}
@media (max-width:900px){.pfgrid{grid-template-columns:1fr}}
.pfprev{position:sticky;top:0;background:var(--bg);border-radius:12px;padding:14px}
.pfprev .infocard{max-width:none}
.sep{height:1px;background:var(--line)}
.btn.danger-t{color:#A11B1B}
.lnk{color:var(--mag-btn-h)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.choice{grid-template-columns:1fr}}
.choicebtn{display:flex;flex-direction:column;gap:12px;align-items:flex-start;text-align:left;padding:20px;background:#fff;border:1px solid var(--line);border-radius:14px;cursor:pointer;font:inherit;color:inherit}
.choicebtn:hover{border-color:var(--mag);background:var(--mag-softer)}
.choicebtn b{display:block;font-size:16px;margin-bottom:4px}
.choicebtn .muted{font-size:13px}
.catbtn{display:flex!important;align-items:center;gap:6px;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden}
.catbtn .catname{flex-shrink:0}
.devtag{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--mag-soft);color:var(--mag-text);flex-shrink:0}
.popover{position:fixed;z-index:60;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 16px 40px rgba(40,10,30,.18);padding:14px;width:300px}
.devlist{display:flex;flex-direction:column;gap:2px;max-height:220px;overflow:auto}
.devopt{display:flex;align-items:center;gap:8px;min-height:30px;cursor:pointer}
.devopt input{width:16px;height:16px;accent-color:var(--mag-btn)}

/* Passwortbewertung */
.toolcell .cell{padding-right:10px}
.grid tr:hover .toolcell .cell,.grid tr.active .toolcell .cell{padding-right:70px}
.pwtools{position:absolute;right:6px;top:0;bottom:0;display:flex;align-items:center;gap:4px;pointer-events:none}
.pwtools .cbtns{position:static;display:none;pointer-events:auto}
.grid tr:hover .pwtools .cbtns,.grid tr.active .pwtools .cbtns{display:flex}
.pwsec{display:flex;align-items:center;gap:4px;pointer-events:auto}
.sdot{display:inline-block;width:9px;height:9px;border-radius:50%}
.sdot.s0{background:#C0392B}.sdot.s1{background:#D68910}.sdot.s2{background:#1E8449}
.dupn{font-size:11px;font-weight:700;color:var(--mag-deep);background:var(--mag-soft);border-radius:999px;padding:1px 6px}
.sec{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.sec i,.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0}
.s0 i,.dot.s0{background:#C0392B}.s1 i{background:#D68910}.s2 i{background:#1E8449}
.sec.s0{color:#A93226}.sec.s1{color:#9C640C}.sec.s2{color:#1E6B3A}
.dup{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;color:var(--mag-deep);background:var(--mag-soft);border-radius:999px;padding:1px 7px}
.dot.dupdot{background:var(--mag)}
.sec-chip{gap:6px}
.secok{color:#1E6B3A;font-weight:600;font-size:13px}
.warnword{color:#A93226;font-weight:600}
/* Sicherheitstipps */
.tips{width:100%;max-width:640px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 26px;display:flex;flex-direction:column;gap:10px}
.tips ul{margin:0;padding-left:20px;line-height:1.55;color:#2E2A33}
.tips li{margin:5px 0}

/* Abos */
.abobadge{display:inline-flex;align-items:center;gap:4px;font:inherit;font-size:11px;font-weight:600;color:#1F4E79;background:#E8F1FA;border:0;border-radius:999px;padding:3px 9px;margin-right:4px;cursor:pointer;max-width:132px;overflow:hidden;white-space:nowrap;vertical-align:middle}
.abobadge:hover{background:#D6E6F5}
.abobadge svg{width:12px;height:12px;flex:none}
.abobadge.off{color:#5F5966;background:#EEEAF0;text-decoration:line-through}
.racts{text-align:right!important;padding-right:8px!important}
.abobadge svg{width:12px;height:12px;flex-shrink:0}
.cbtn.aboon{color:#1F4E79}
.racts .cbtn.aboon{opacity:1}
.abosums{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.abosum{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.abosum b{font-size:18px}
.abosum.warn{border-color:#D68910;background:#FFF9EF}
.hints{gap:6px;padding:10px}
.hint{all:unset;cursor:pointer;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;padding:8px 10px;border-radius:8px;border-left:4px solid #D68910;background:#FFF9EF}
.hint.kuend{border-left-color:#C0392B;background:#FDF0EE}
.hint:hover{filter:brightness(.97)}
.hint span{color:#4A4450;font-size:13px}
table.abotable{table-layout:auto;min-width:900px}
.abotable th>span{display:block;padding:10px}
.abotable td{padding:0 10px;height:42px;cursor:pointer}
.abotable td.soon{color:#A93226;font-weight:600}
.status{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px}
.status.on{background:#E7F4EC;color:#1E6B3A}.status.off{background:#EEEAF0;color:#5F5966}

/* Hilfe */
details.help{background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 18px;scroll-margin-top:16px}
details.help[open]{border-color:var(--mag)}
details.help summary{cursor:pointer;font-weight:700;font-size:15px;padding:14px 0;list-style:none;display:flex;align-items:center;gap:10px}
details.help summary::-webkit-details-marker{display:none}
details.help summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--mag);border-bottom:2px solid var(--mag);transform:rotate(-45deg);transition:transform .15s;flex-shrink:0}
details.help[open] summary::before{transform:rotate(45deg)}
.helpbody{padding:0 0 16px;color:#2E2A33;line-height:1.6}
.helpbody ul,.helpbody ol{margin:0 0 8px;padding-left:20px}
.helpbody li{margin:4px 0}
.helpbody p{margin:0 0 10px}
.helpbody svg{vertical-align:-3px;color:var(--mag-text)}
.helpbody .note{background:var(--mag-softer);border-left:3px solid var(--mag);padding:8px 12px;border-radius:0 8px 8px 0}
kbd{font-family:inherit;font-size:12px;background:#F1EDF3;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px}
table.keys{border-collapse:collapse;margin:4px 0 12px}
table.keys td{padding:3px 14px 3px 0}

/* Dialoge */
.overlay{position:fixed;inset:0;background:rgba(28,26,30,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dialog{width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dialog h2{font-size:20px;font-weight:700}
.dialog .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.toast{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;z-index:70;max-width:90%}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;z-index:80}
.busy .in{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 26px;display:flex;gap:14px;align-items:center;box-shadow:0 12px 40px rgba(40,10,30,.12);max-width:420px}
.spin{width:26px;height:26px;border:3px solid var(--mag-soft);border-top-color:var(--mag);border-radius:50%;animation:sp 0.9s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
.pwfield{display:flex;gap:6px}
.pwfield .field{flex:1}

/* Druck */
#print{display:none}
@media print{
  /* Eigene Seitenränder: ersetzen die Kopf-/Fusszeile des Browsers (Titel, Pfad, Datum) und zeigen die Seitenzahl. */
  @page{size:A4;margin:12mm 15mm 14mm 15mm;
    @top-left{content:""} @top-center{content:""} @top-right{content:""}
    @bottom-left{content:"";font-size:8pt;color:#555;font-family:"Segoe UI",system-ui,sans-serif}
    @bottom-center{content:""}
    @bottom-right{content:"Seite " counter(page) " von " counter(pages);font-size:8pt;color:#555;font-family:"Segoe UI",system-ui,sans-serif}}
  html,body{background:#fff;height:auto}
  #app,.overlay,.toast,.busy{display:none!important}
  #print{display:block;color:#000;font-size:10pt}
  .pr-page{page-break-after:always}
  .pr-pw td{border-bottom:0.5pt solid #ddd}
  .pr-pw th{text-align:left;font-weight:600;color:#444;padding:1pt 4pt 2pt 0;border-bottom:0.75pt solid #bbb;font-size:9pt}
  .pr-pw td:first-child{width:auto!important;color:#000!important}
  .pr-pw tr.pr-hc td{border-bottom:0;padding-bottom:0}
  .pr-pw tr.pr-cred td{font-size:8.5pt;color:#333;padding-top:0}
  .pr-pw .mono{font-family:Consolas,"Courier New",monospace}
  .pr-mono{font-family:Consolas,"Courier New",monospace}
  .pr-page:last-child{page-break-after:auto}
  .pr-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--mag);padding-bottom:6pt;margin-bottom:4pt}
  .pr-head img{height:34pt;width:auto;flex-shrink:0;margin-left:12pt}
  .pr-head h1{font-size:18pt}
  .pr-meta{font-size:9pt;color:#555}
  .pr-addr{font-size:8.5pt;line-height:1.35;color:#333}
  .pr-title{font-size:18pt;font-weight:700;margin:8pt 0 2pt}
  .pr-sec{padding:6pt 0 3pt;break-inside:avoid}
  .pr-sec+.pr-sec{border-top:0.75pt solid #bbb}
  .pr-sec h2{font-size:11pt;margin:0 0 3pt;color:var(--mag-text)}
  .pr-sec table{width:100%;border-collapse:collapse}
  .pr-sec td{padding:1pt 4pt 1pt 0;vertical-align:top;white-space:pre-line}
  .pr-sec td:first-child{width:30%;color:#444}
  .nl-doc .pr-sec p{margin:0 0 4pt}
  .nl-pr td{font-size:9pt}
  .nl-pr td:first-child{font-weight:600}
  .nl-pr td{overflow-wrap:anywhere}
  .nl-doc .nl-pr{border-top:0!important;padding-top:10pt}
  .nl-pr tr.blank td{height:14pt;border-bottom:0.5pt solid #ccc}
  .nl-sign{break-inside:avoid}
  .nl-sigrow{display:flex;gap:30pt;margin-top:28pt}
  .nl-sigrow>div{flex:1}
  .nl-line{border-bottom:0.75pt solid #000;min-height:14pt;padding-bottom:2pt}
  .pr-notes{white-space:pre-line}
  .pr-foot{margin-top:10pt;padding-top:6pt;border-top:0.75pt solid #bbb;font-size:8.5pt;color:#555}
  .pr-key{font-family:Consolas,monospace;font-size:20pt;letter-spacing:1pt;border:1.5pt dashed var(--mag);padding:12pt;text-align:center;margin:14pt 0}
}

function brand() { return brandOf(P && P.appName); }
function appTitle() { return String((P && P.appName) || DEFAULT_NAME).replace(/[\[\]]/g, ""); }
// Urheber des Programms (bleibt auch bei Firmenangaben sichtbar)
const AUTHOR = "Stefan Kammermann", REPO_URL = "https://github.com/Kammermanns/StickTresor";
function credit() { return `StickTresor von <a href="#" data-act="url" data-id="${REPO_URL}">${AUTHOR}</a>`; }
// Neutrales Logo (Schild mit Schlüsselloch) in der Akzentfarbe
function defaultLogo(color) {
  const c = color || DEFAULT_COLOR;
  return "data:image/svg+xml;base64," + btoa(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><path d="M60 8 102 24v30c0 28-18 48-42 58C36 102 18 82 18 54V24Z" fill="${c}"/><circle cx="60" cy="52" r="13" fill="#fff"/><path d="M54 60h12l4 26H50Z" fill="#fff"/></svg>`);
}
function logo() { return (P && P.logo) || defaultLogo(P && P.color); }
// Farbschema aus einer Akzentfarbe ableiten (dunklere Töne für Schaltflächen und Text)
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbHex(c) { return "#" + c.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0")).join("").toUpperCase(); }
function mix(h, to, t) { const a = hexRgb(h), b = hexRgb(to); return rgbHex(a.map((v, i) => v + (b[i] - v) * t)); }
function lum(h) { const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; const [r, g, b] = hexRgb(h).map(f); return 0.2126 * r + 0.7152 * g + 0.0722 * b; }
function contrast(a, b) { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
function darkEnough(h, min) { let t = 0, c = h; while (contrast(c, "#FFFFFF") < min && t < 0.9) { t += 0.04; c = mix(h, "#000000", t); } return c; }
function themeVars(color) {
  const c = /^#[0-9A-Fa-f]{6}$/.test(color || "") ? color.toUpperCase() : DEFAULT_COLOR;
  const btn = darkEnough(mix(c, "#000000", 0.09), 4.5);
  return { "--mag": c, "--mag-btn": btn, "--mag-btn-h": mix(btn, "#000000", 0.15), "--mag-text": darkEnough(mix(c, "#000000", 0.31), 6),
    "--mag-deep": darkEnough(mix(c, "#000000", 0.47), 8), "--mag-soft": mix(c, "#FFFFFF", 0.89), "--mag-softer": mix(c, "#FFFFFF", 0.965) };
}
function themeStyle(color) { return Object.entries(themeVars(color)).map(([k, v]) => `${k}:${v}`).join(";"); }
function applyTheme() {
  const v = themeVars(P && P.color);
  Object.entries(v).forEach(([k, val]) => document.documentElement.style.setProperty(k, val));
  document.title = appTitle();
}
const hasSupport = p => p && (p.tel || p.mail || p.web || p.helpdesk);

// ---------- Verbindung zur App (Go) ----------
const api = new Proxy({}, { get: (_, n) => (...a) => {
  const f = window["api_" + n];

const errText = e => (e && e.message) ? e.message : String(e);

// ---------- Hilfen ----------
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  edit: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',

};

let S = { status: null, data: null, view: "home", pcId: null, catId: "all", q: "", shown: new Set(), editPc: null, loginMode: "pw", error: "" };

function toast(msg) {
  let t = $("#toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.classList.remove("hidden");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add("hidden"), 3200);
}
function busy(msg) {
  let b = $("#busy");
  if (msg === false) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement("div"); b.id = "busy"; b.className = "busy"; document.body.appendChild(b); }
  b.innerHTML = '<div class="in"><div class="spin"></div><div>' + esc(msg) + '</div></div>';
}
async function run(msg, fn) {
  busy(msg);
  try { return await fn(); } finally { busy(false); }
}

// ---------- Ablauf ----------
async function refresh() {
  try {
    S.status = await api.status();
  } catch (e) { S.status = { state: "error" }; S.error = errText(e); }
  P = S.status.partner || null;
  applyTheme();
  if (S.status.state === "open") {
    try { S.data = await api.data(); } catch (e) { S.error = errText(e); }
  } else {
    S.data = null; S.shown.clear(); S.editPc = null;
  }
  render();
}

function render() {
  closeDialog(); closePopover();
  const st = S.status ? S.status.state : "loading";
  const app = $("#app");
  if (st === "loading") app.innerHTML = '<div class="center"><div class="spin"></div></div>';
  else if (st === "new") app.innerHTML = viewNew();
  else if (st === "locked" || st === "handover-locked") app.innerHTML = viewLogin();
  else if (st === "setpw") app.innerHTML = viewSetPw();
  else if (st === "handed-over") app.innerHTML = viewHandedOver();
  else if (st === "open" && S.data) app.innerHTML = viewMain();
  else app.innerHTML = '<div class="center"><div class="card"><div class="err">' + esc(S.error || "Unbekannter Fehler") + '</div></div></div>';
  bind();
  const f = document.querySelector("[autofocus]"); if (f) f.focus();
}

// ---------- Bildschirm: neuer Tresor ----------
function viewNew() {
  const s = S.status;
  const foot = `<div class="cardfoot"><span>${esc(s.file)}</span><span>Version ${esc(s.version)} · ${credit()}</span></div>`;
  const ro = s.writable ? "" : '<div class="err">In diesen Ordner kann nicht geschrieben werden. Ist der Stick schreibgeschützt?</div>';
  if (!P) {
    return `<div class="center"><div class="card wide">
      <img class="logo" src="${logo()}" alt="">
      <div style="text-align:center" class="stack"><div class="brand big">${brand()}</div><div class="muted">PC-Datenblätter, Passwörter und Abos, verschlüsselt auf dem USB-Stick.</div></div>

// Logo einlesen: SVG unverändert, Bilder auf höchstens 800×400 Pixel verkleinern
function readLogo(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = () => rej("Die Datei konnte nicht gelesen werden.");
    r.onload = () => {
      const url = r.result;
      if (file.type === "image/svg+xml") return url.length > 1400000 ? rej("Das Logo ist zu gross (max. 1 MB).") : res(url);
      const img = new Image();
      img.onerror = () => rej("Das Bild konnte nicht gelesen werden.");
      img.onload = () => {
        const k = Math.min(1, 800 / img.width, 400 / img.height);
        const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        const out = c.toDataURL("image/png");
        out.length > 1400000 ? rej("Das Logo ist zu gross.") : res(out);
      };
      img.src = url;
    };
    r.readAsDataURL(file);
  });
}

// ---------- Passwortbewertung ----------
// Häufige Wörter und Muster, die Angreifer zuerst ausprobieren
const COMMON_PW = ["passwort", "password", "kennwort", "pass", "123456", "12345", "1234", "qwertz", "qwerty", "asdf", "yxcv", "admin", "root", "login", "user",
  "welcome", "willkommen", "hallo", "hello", "letmein", "geheim", "secret", "test", "abc", "iloveyou", "sommer", "winter", "herbst", "fruehling", "frühling",
  "schweiz", "suisse", "bern", "dragon", "monkey", "master", "000000", "111111", "123123", "654321", "fussball", "football"];
// rate: Bits der geschätzten Stärke, 0 = leer. Grenzen: < 40 schwach, < 64 mittel, sonst stark.
function rateBits(pw) {
  if (!pw) return 0;
  let pool = 0;
  if (/[a-z]/.test(pw)) pool += 26; if (/[A-Z]/.test(pw)) pool += 26; if (/[0-9]/.test(pw)) pool += 10; if (/[^A-Za-z0-9]/.test(pw)) pool += 33;
  // Wiederholungen (aaa) und Folgen (abc, 123) zählen kaum
  let eff = 1;
  for (let i = 1; i < pw.length; i++) {
    const d = pw.charCodeAt(i) - pw.charCodeAt(i - 1);
    eff += (d === 0 || d === 1 || d === -1) ? 0.25 : 1;
  }
  let bits = eff * Math.log2(Math.max(pool, 2));
  const low = pw.toLowerCase().replace(/[@4]/g, "a").replace(/3/g, "e").replace(/[1!]/g, "i").replace(/0/g, "o").replace(/\$/g, "s");
  const hits = COMMON_PW.filter(w => low.includes(w) || pw.toLowerCase().includes(w));
  if (hits.length) bits -= 12 + 4 * Math.max(...hits.map(w => w.length));
  if (/(19|20)\d\d/.test(pw)) bits -= 6;          // Jahreszahl
  if (/^[A-Z]?[a-zäöü]+[0-9!?.]{0,3}$/.test(pw)) bits -= 8; // Wort + Ziffer/Zeichen am Ende
  return Math.max(1, bits);
}
function rate(pw) {
  const b = rateBits(pw);
  if (!b) return { s: -1, l: "" };
  return b < 40 ? { s: 0, l: "Schwach" } : b < 64 ? { s: 1, l: "Mittel" } : { s: 2, l: "Stark" };
}
function strength(pw) { return Math.min(100, Math.round(rateBits(pw) / 0.8)); }
function dupCount(pw, ownId) {
  if (!pw) return 0;
  const n = S.data.entries.filter(e => e.password === pw && e.id !== ownId).length;
  return n ? n + 1 : 0;
}
function secBadge(pw, id) {
  const r = rate(pw);
  if (r.s < 0) return "";
  const n = dupCount(pw, id);
  return `<i class="sdot s${r.s}" title="Stärke: ${r.l}"></i>${n ? `<span class="dupn" title="Dasselbe Passwort wird in ${n} Einträgen verwendet">${n}×</span>` : ""}`;
}
function secStats() {
  const es = S.data.entries.filter(e => e.password);
  const cnt = {}; es.forEach(e => cnt[e.password] = (cnt[e.password] || 0) + 1);
  return { weak: es.filter(e => rate(e.password).s === 0).length, dup: es.filter(e => cnt[e.password] > 1).length, total: es.length };
}
function isWeak(e) { return e.password && rate(e.password).s === 0; }
function isDup(e) { return e.password && S.data.entries.some(x => x.id !== e.id && x.password === e.password); }
function updateMeter() {
  const pw = ($("#np1") || {}).value || "", m = $("#meter"), t = $("#meter-t");
  if (!m) return;
  const r = rate(pw);
  m.style.width = (pw ? Math.max(8, strength(pw)) : 0) + "%";
  m.style.background = r.s <= 0 ? "#C0392B" : r.s === 1 ? "#D68910" : "#1E8449";
  if (pw.length) t.textContent = pw.length < 6 ? "Noch zu kurz (mindestens 6 Zeichen)." : r.s === 0 ? "Schwach. Länger machen oder mehrere Wörter verwenden." : r.s === 1 ? "Mittel. Ein paar Zeichen mehr machen es deutlich sicherer." : "Stark.";
}

    <section class="tips">
      <div class="row" style="gap:10px;align-items:center"><span class="tic small">${I.shield}</span><h2 style="font-size:16px">Sicherheitstipps für gute Passwörter</h2></div>
      <ul>
        <li><b>Lang statt kompliziert.</b> Gut zu merken und trotzdem sicher sind <b>vier oder mehr zufällig gewählte Wörter</b>, die nichts miteinander zu tun haben, z.B. <span class="mono">Tinte-Ferse-Kompass-Ahorn</span> (nur ein Beispiel, bitte nicht verwenden). Kein Satz und kein Zitat. Kürzere Passwörter mit 8–12 Zeichen nur, wenn sie zufällig aus Gross- und Kleinbuchstaben, Ziffern und Sonderzeichen gemischt sind. Am einfachsten lassen Sie sie mit dem Würfel ${I.dice} erzeugen.</li>
        <li><b>Jedes Passwort nur einmal.</b> Wird ein Online-Dienst gehackt, probieren Angreifer die gestohlenen Zugangsdaten automatisch bei E-Mail, Bank und Shops aus. Mit verschiedenen Passwörtern bleibt der Schaden auf ein Konto beschränkt.</li>
        <li><b>Nichts Persönliches, keine Muster.</b> Keine Namen, Geburtstage, Firmennamen oder Telefonnummern und keine Folgen wie <span class="mono">123456</span>, <span class="mono">qwertz</span> oder <span class="mono">Passwort1</span>.</li>
        <li><b>Zwei-Faktor-Anmeldung einschalten,</b> wo es geht, besonders bei E-Mail, Microsoft 365 und E-Banking. Dann reicht ein gestohlenes Passwort allein nicht.</li>
        <li><b>Passwörter nur hier aufbewahren,</b> nicht auf Zetteln oder in E-Mails. Master-Passwort und Wiederherstellungsschlüssel getrennt vom Stick aufbewahren.</li>
        <li><b>Bei Verdacht sofort ändern,</b> zum Beispiel nach einer verdächtigen E-Mail (Phishing) oder einer Meldung über ein Datenleck. Wir helfen gern.</li>
      </ul>
      <div class="small muted">Der Sicherheitscheck unter <a href="#" data-act="go" data-id="pw">Passwörter</a> zeigt schwache und mehrfach verwendete Passwörter.</div>
    </section>
  </div>`;
}

// ----- PC-Datenblatt -----
const WIFI_PW = "WLAN-Passwort"; // wird nicht im Datenblatt gespeichert, sondern aus dem Passwort-Eintrag gelesen
function knownKeys() { const k = new Set(["Erfasst am"]); S.data.sections.forEach(s => s.keys.forEach(x => k.add(x))); return k; }
function wifiEntry(pc) {
  const ssid = fieldVal(pc, "WLAN-Name"); if (!ssid) return null;
  return S.data.entries.find(e => e.title.toLowerCase() === ("wlan " + ssid).toLowerCase()) || S.data.entries.find(e => e.userName === ssid && /^wlan/i.test(e.title)) || null;
}
function isCust(k) { return (S.data.customerKeys || []).includes(k); }

function viewPC() {
  const pc = curPC();
  if (!pc) return viewDevices();
  if (S.editPc && S.editPc.id === pc.id) return viewPCEdit();
  const secs = S.data.sections, known = knownKeys();
  const box = sec => {
    const rows = sec.keys.map(k => {

        const vis = S.shown.has(e.id);
        return `<div class="kv"><span class="k">${k}</span><span class="v row" style="gap:4px;flex-wrap:wrap"><span class="mono">${e.password ? (vis ? esc(e.password) : "••••••••••") : '<span class="muted">nicht ausgelesen</span>'}</span>

      <h1>${esc(pc.name)}</h1><div style="color:#4A4450">${esc([fieldVal(pc, "Hersteller"), fieldVal(pc, "Modell")].filter(Boolean).join(" · "))}</div></div>
      <div class="row"><button class="btn" data-act="entry-new-pc">${I.plus} Passwort</button><button class="btn" data-act="pc-edit">${I.edit} Bearbeiten</button><button class="btn" data-act="pc-print">${I.print} Drucken / PDF</button></div></div>
    <div class="sheet"><div class="sheetcol">${col("left")}</div><div class="sheetcol">${col("right")}
      ${other.length ? `<section class="box"><h2>Weitere Felder</h2>${other.map(f => kvRow(f.key, f.value)).join("")}</section>` : ""}</div></div>
    ${pc.notes ? `<section class="box"><h2>Notizen</h2><div class="kv multi"><span class="v">${esc(pc.notes)}</span></div></section>` : ""}
    ${linked.length ? `<section class="box"><h2>Zugehörige Passwörter <span style="color:#555;font-weight:400;font-size:9pt">· vertraulich aufbewahren</span></h2>
      ${linked.length ? linked.map(e => `<div class="kv"><span class="k">${esc(e.title)}</span><span class="v row" style="gap:4px;flex-wrap:wrap"><span>${esc(e.userName || "–")}</span><span class="spacer"></span>
        ${e.password ? `<button class="btn g" data-act="pw-copy" data-id="${esc(e.id)}">${I.copy} Passwort</button>` : ""}<button class="btn g" data-act="entry-edit" data-id="${esc(e.id)}" aria-label="Bearbeiten">${I.edit}</button></span></div>`).join("")
        : ""}
    </section>` : ""}`;
}
function kvRow(k, v, multi, empty) {
  return `<div class="kv ${multi ? "multi" : ""}"><span class="k">${esc(k)}</span><span class="v${empty ? " muted" : ""}">${esc(v)}</span></div>`;

function viewPCEdit() {
  const e = S.editPc, secs = S.data.sections, known = knownKeys();
  const inp = (k, v, multi) => `<div class="kv edit"><label class="k" for="f-${esc(k)}">${esc(k)}</label>${multi || v.indexOf("\n") >= 0 || v.length > 55
      ? `<textarea class="field" id="f-${esc(k)}" data-key="${esc(k)}" rows="${Math.min(12, Math.max(2, v.split("\n").length, Math.ceil(v.length / 55)))}">${esc(v)}</textarea>`
      : `<input class="field" id="f-${esc(k)}" data-key="${esc(k)}" value="${esc(v)}">`}</div>`;
  const box = sec => `<section class="box"><h2>${esc(sec.title)}</h2>${sec.keys.filter(k => k !== WIFI_PW).map(k => inp(k, val(e, k), sec.multline)).join("")}</section>`;
  const col = c => secs.filter(s => s.column === c).map(box).join("");
  const other = e.fields.filter(f => !known.has(f.key));
  return `<div class="pagehead"><div class="t"><div class="small muted">Datenblatt bearbeiten</div><h1>${esc(e.name)}</h1></div>
      <div class="row"><button class="btn danger" data-act="pc-delete">Gerät löschen</button><button class="btn" data-act="pc-cancel">Abbrechen</button><button class="btn p" data-act="pc-save">Speichern</button></div></div>

      <section class="box"><div class="row"><h2>Eigene Felder</h2><span class="small muted">z.B. Inventarnummer, Lieferant</span></div>
        <div id="own" class="stack" style="gap:8px">${other.map(f => ownRow(f.key, f.value)).join("")}</div>
        <div><button class="btn g" data-act="own-add">${I.plus} Feld hinzufügen</button></div></section></div></div>
    <section class="box"><h2>Notizen</h2><textarea class="field" id="pc-notes" rows="5" placeholder="Software-Lizenzen, Besonderheiten, Ansprechpartner …">${esc(e.notes)}</textarea></section>

}
function val(pc, k) { const f = pc.fields.find(f => f.key === k); return f ? f.value : ""; }
function ownRow(k, v) {
  return `<div class="row own" style="flex-wrap:nowrap"><input class="field own-k" placeholder="Feldname" value="${esc(k)}" style="flex:0 1 200px" aria-label="Feldname"><input class="field own-v" placeholder="Wert" value="${esc(v)}" style="flex:1" aria-label="Wert"><button class="btn g" data-act="own-del" aria-label="Feld entfernen">✕</button></div>`;
}
function collectPCEdit() {
  const e = S.editPc;
  const fields = [], seen = new Set();
  document.querySelectorAll("#content [data-key]").forEach(el => {
    const k = el.dataset.key, v = el.value.trim();
    if (v && !seen.has(k)) { fields.push({ key: k, value: v }); seen.add(k); }
  });
  const ce = e.fields.find(f => f.key === "Erfasst am"); if (ce) { fields.push(ce); seen.add(ce.key); }
  let bad = "";
  document.querySelectorAll("#own .own").forEach(r => {
    const k = r.querySelector(".own-k").value.trim(), v = r.querySelector(".own-v").value;
    if (!k && !v.trim()) return;
    if (!k) { bad = "Bitte jedem eigenen Feld einen Namen geben."; return; }
    if (seen.has(k) || knownKeys().has(k) || ["Title", "UserName", "Password", "URL", "Notes", "Notizen", "PC-Name", WIFI_PW].includes(k)) { bad = "Der Feldname «" + k + "» ist schon vergeben."; return; }
    seen.add(k); fields.push({ key: k, value: v });
  });
  if (bad) throw bad;
  return { id: e.id, name: $("#pc-name").value.trim(), notes: $("#pc-notes").value, fields };
}

// ----- Passwörter: Tabelle wie in Excel -----
const GCOLS = [
  { k: "title", l: "Bezeichnung", w: "16%" },
  { k: "userName", l: "Benutzer", w: "14%" },
  { k: "password", l: "Passwort", w: "18%" },
  { k: "url", l: "URL", w: "15%" },
  { k: "notes", l: "Notizen", w: "" },
  { k: "cat", l: "Kategorie · Geräte", w: "19%" }
];
// Mit Abos braucht die letzte Spalte Platz für das Abzeichen
const ABO_W = { title: "15%", userName: "13%", password: "17%", url: "14%", cat: "16%" };
const pendingSaves = new Set();
function gridCols() { return GCOLS; }
function defaultCatId() {
  const d = S.data;
  if (S.catId !== "all" && d.categories.some(c => c.id === S.catId)) return S.catId;
  const c = d.categories.find(c => !c.root) || d.categories[0];
  return c ? c.id : "";
}
// alle bekannten Geräte: erfasste PCs plus Namen, die in Einträgen vorkommen
function allDevices() {
  const m = new Map();
  S.data.pcs.forEach(p => m.set(p.name.toLowerCase(), p.name));
  S.data.entries.forEach(e => (e.devices || []).forEach(d => { if (!m.has(d.toLowerCase())) m.set(d.toLowerCase(), d); }));
  return [...m.values()].sort((a, b) => a.localeCompare(b, "de"));
}
function hasDev(e, d) { return (e.devices || []).some(x => x.toLowerCase() === d.toLowerCase()); }
function catLabel(catId, devs) {
  const c = catName(catId) || "–";
  return `<span class="catname">${esc(c)}</span>${(devs || []).map(d => `<span class="devtag">${I.pcSmall}${esc(d)}</span>`).join("")}`;
}
function viewPw() {
  const d = S.data, q = S.q.trim().toLowerCase();
  if (S.devF && !allDevices().some(x => x.toLowerCase() === S.devF.toLowerCase())) S.devF = "";
  let list = d.entries;
  if (q) list = list.filter(e => [e.title, e.userName, e.url, e.notes, (e.devices || []).join(" "), catName(e.categoryId)].join(" ").toLowerCase().includes(q));
  else {
    if (S.catId !== "all") list = list.filter(e => e.categoryId === S.catId);
    if (S.devF) list = list.filter(e => hasDev(e, S.devF));
  }
  if (S.secF === "weak") list = list.filter(isWeak);
  if (S.secF === "dup") list = list.filter(isDup);
  const sk = (S.sort && S.sort.k) || "title", sd = (S.sort && S.sort.dir) || 1;
  const sv = e => (sk === "cat" ? catName(e.categoryId) + " " + (e.devices || []).join(" ") : sk === "password" ? String(e.password ? rate(e.password).s + (isDup(e) ? 0 : 0.5) : 9) : (e[sk] || "")).toLowerCase();
  list = list.slice().sort((a, b) => sd * sv(a).localeCompare(sv(b), "de") || a.title.localeCompare(b.title, "de"));
  const chip = (id, name, n) => `<button class="chip ${!q && S.catId === id ? "on" : ""}" data-act="cat" data-id="${esc(id)}">${esc(name)} <span data-count="${esc(id)}">${n}</span></button>`;
  const devs = allDevices();
  const dchip = (name, label, n) => `<button class="chip ${!q && (S.devF || "") === name ? "on" : ""}" data-act="devf" data-id="${esc(name)}">${name ? I.pcSmall : ""}${esc(label)} <span>${n}</span></button>`;
  const cols = gridCols();
  const hasAbo = d.entries.some(x => x.abo && x.abo.active);
  return `<div class="pagehead"><div class="t"><h1>Passwörter</h1></div>
      <div class="row"><button class="btn" data-act="import">${I.upload} Importieren</button><button class="btn p" data-act="row-add">${I.plus} Neue Zeile</button></div></div>
    <div class="chips"><span class="chiplabel">Kategorie</span>${chip("all", "Alle", d.entries.length)}${d.categories.filter(c => !c.root || c.count || S.catId === c.id).map(c => chip(c.id, c.name, c.count)).join("")}
      <button class="chip add" data-act="cat-manage">${I.edit} Kategorien bearbeiten</button></div>
    ${devs.length ? `<div class="chips"><span class="chiplabel">Gerät</span>${dchip("", "Alle Geräte", d.entries.length)}${devs.map(n => dchip(n, n, d.entries.filter(e => hasDev(e, n)).length)).join("")}</div>` : ""}
    <div class="row" style="justify-content:space-between">
      <div style="flex:1 1 300px;max-width:440px"><input id="search" class="field" type="search" placeholder="Alle Passwörter durchsuchen …" aria-label="Passwörter durchsuchen" value="${esc(S.q)}"></div>
      ${secCheck()}
    </div>
    <div class="gridwrap"><table class="grid" id="grid">
      <colgroup>${cols.map(c => `<col${c.w ? ` style="width:${hasAbo ? (ABO_W[c.k] || c.w) : c.w}"` : ""}>`).join("")}<col style="width:${hasAbo ? 180 : 100}px"></colgroup>
      <thead><tr>${cols.map(c => `<th><button data-act="sort" data-id="${c.k}">${c.l}${sk === c.k ? (sd > 0 ? " ▲" : " ▼") : ""}</button></th>`).join("")}<th></th></tr></thead>
      <tbody id="gbody">${list.map(gridRow).join("")}</tbody>
    </table>
    ${list.length ? "" : `<div class="emptybox" id="gempty">${q ? "Keine Treffer." : "Keine Einträge. Mit «+ Neue Zeile» anfangen oder eine Liste importieren."}</div>`}
    </div>
    <div class="row small muted" style="justify-content:space-between">
      <button class="btn g" data-act="row-add">${I.plus} Neue Zeile</button>
      <span>Tab: nächste Zelle · Enter: Zeile darunter · Esc: Änderung verwerfen · Änderungen werden automatisch gespeichert</span>
    </div>`;
}
// Zelle mit kleinen Knöpfen rechts (erscheinen beim Darüberfahren bzw. in der aktiven Zeile)
function toolCell(k, v, btns) {
  return `<td class="toolcell"><input class="cell" data-k="${k}" value="${esc(v)}" data-orig="${esc(v)}" aria-label="${k}" spellcheck="false" autocomplete="off">
    <span class="pwtools"><span class="cbtns">${btns.map(([a, ic, t]) => `<button class="cbtn" tabindex="-1" data-gact="${a}" title="${t}" aria-label="${t}">${ic}</button>`).join("")}</span></span></td>`;
}
// Adresse für den Browser vervollständigen (192.168.1.1 → http://…, galaxus.ch → https://…)
function fullURL(u) {
  u = String(u || "").trim();
  if (!u) return "";
  if (/^(https?:\/\/|mailto:)/i.test(u)) return u;
  if (/^[\w.+-]+@[\w-]+\.[\w.-]+$/.test(u)) return "mailto:" + u;
  if (/^(\d{1,3}\.){3}\d{1,3}(:\d+)?(\/.*)?$/.test(u) || /^(localhost|[\w-]+)(:\d+)?(\/.*)?$/.test(u)) return "http://" + u;
  return "https://" + u;
}
function gridRow(e) {
  const cell = (k, v, extra) => `<td><input class="cell ${extra || ""}" data-k="${k}" value="${esc(v)}" data-orig="${esc(v)}" aria-label="${k}" spellcheck="false" autocomplete="off"></td>`;
  const cat = e.categoryId || defaultCatId(), devs = e.devices || (S.devF ? [S.devF] : []);
  return `<tr data-id="${esc(e.id || "")}" data-cat="${esc(cat)}" data-devs="${esc(JSON.stringify(devs))}">

    <td class="pwcell"><input class="cell mono" type="password" data-k="password" value="${esc(e.password || "")}" data-orig="${esc(e.password || "")}" aria-label="Passwort" spellcheck="false" autocomplete="new-password">

    ${toolCell("url", e.url || "", [["copyurl", I.copy, "Link kopieren"], ["openurl", I.ext, "Link im Browser öffnen"]])}${cell("notes", e.notes || "")}
    <td><button class="cell catbtn" data-gact="cat" aria-label="Kategorie und Geräte wählen">${catLabel(cat, devs)}</button></td>
    <td class="racts">${e.abo && e.abo.active ? aboBadge(e.abo) : `<button class="cbtn" tabindex="-1" data-gact="abo" title="Als Abo erfassen" aria-label="Abo">${I.repeat}</button>`}<button class="cbtn" tabindex="-1" data-gact="details" title="Details" aria-label="Details">${I.edit}</button><button class="cbtn" tabindex="-1" data-gact="del" title="Löschen" aria-label="Löschen">${I.trash}</button></td>
  </tr>`;
}
// Auswahlfenster für Kategorie und Geräte einer Zeile
function catPopover(tr, btn) {

}
function toastAction(msg, label, fn) {

const IMPORT_FIELDS = [
  ["", "– ignorieren –"], ["title", "Bezeichnung"], ["userName", "Benutzer"], ["password", "Passwort"],
  ["url", "URL"], ["pc", "Gerät"], ["notes", "Notizen"], ["category", "Kategorie"]

const IMPORT_SYN = {
  title: ["name", "title", "titel", "bezeichnung", "eintrag", "konto", "account", "dienst", "service", "beschreibung"],
  userName: ["username", "user", "user name", "benutzer", "benutzername", "login", "login_username", "email", "e-mail", "mail", "anmeldename", "loginname"],
  password: ["password", "passwort", "kennwort", "pw", "login_password", "pass", "pwd"],
  url: ["url", "login_uri", "website", "webseite", "web site", "adresse", "link", "uri", "homepage", "web"],
  notes: ["notes", "note", "notizen", "notiz", "bemerkung", "bemerkungen", "kommentar", "comments", "extra"],
  pc: ["gerät", "geraet", "pc", "computer", "device", "rechner"],
  category: ["group", "gruppe", "folder", "ordner", "kategorie", "category", "grouping"]

function parseTable(text) {
  text = text.replace(/^﻿/, "").replace(/\r\n?/g, "\n");
  const first = text.split("\n").find(l => l.trim()) || "";
  const delim = first.includes("\t") ? "\t" : (first.split(";").length > first.split(",").length ? ";" : ",");
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"' && cur === "") q = true;
    else if (c === delim) { row.push(cur); cur = ""; }
    else if (c === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function guessMapping(rows) {
  const head = (rows[0] || []).map(h => h.trim().toLowerCase().replace(/^"|"$/g, ""));
  const map = head.map(h => { for (const [f, syn] of Object.entries(IMPORT_SYN)) if (syn.includes(h)) return f; return ""; });
  const hits = map.filter(Boolean).length;
  if (hits >= 2 || (hits === 1 && head.length === 1)) {
    // jedes Feld nur einmal
    const used = new Set(); map.forEach((f, i) => { if (f && used.has(f)) map[i] = ""; else used.add(f); });
    return { header: true, map };
  }
  const n = (rows[0] || []).length;
  const def = ["title", "userName", "password", "url", "notes"];
  return { header: false, map: Array.from({ length: n }, (_, i) => def[i] || "") };
}
function importDialog(prefill) {

// ----- Abos -----
const ABO_INT = [["monatlich", 1, "Mt."], ["vierteljährlich", 1 / 3, "Quartal"], ["halbjährlich", 1 / 6, "Halbjahr"], ["jährlich", 1 / 12, "Jahr"], ["alle 2 Jahre", 1 / 24, "2 Jahre"], ["wöchentlich", 52 / 12, "Woche"]];
const ABO_NOTICE = ["", "jederzeit", "1 Woche", "2 Wochen", "1 Monat", "2 Monate", "3 Monate", "6 Monate"];
const ABO_CUR = ["CHF", "EUR", "USD"];
function aboInt(a) { return ABO_INT.find(x => x[0] === a.interval) || ABO_INT[0]; }
function perMonth(a) { return (parseFloat(a.cost) || 0) * aboInt(a)[1]; }
function money(v, cur) { return (cur || "CHF") + " " + Number(v || 0).toLocaleString("de-CH", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function today0() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function parseISO(s) { if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; const d = new Date(s + "T00:00:00"); return isNaN(d) ? null : d; }
function fmtD(d) { return d ? d.toLocaleDateString("de-CH", { day: "2-digit", month: "2-digit", year: "numeric" }) : "–"; }
function addInt(d, interval, sign) {
  const n = new Date(d), k = sign || 1;
  const m = { "monatlich": 1, "vierteljährlich": 3, "halbjährlich": 6, "jährlich": 12, "alle 2 Jahre": 24 }[interval];
  if (m) n.setMonth(n.getMonth() + k * m); else n.setDate(n.getDate() + k * 7);
  return n;
}
// nächste Verlängerung; liegt das Datum in der Vergangenheit, wird es fortgeschrieben
function nextDue(a) {
  let d = parseISO(a.next); if (!d) return null;
  if (a.status === "gekündigt") return d;
  const t = today0(); let g = 0;
  while (d < t && g++ < 600) d = addInt(d, a.interval);
  return d;
}
// letzter Tag, an dem noch gekündigt werden kann
function noticeBy(a) {
  const d = nextDue(a); if (!d || !a.notice || a.notice === "jederzeit") return null;
  const m = a.notice.match(/(\d+)\s*(Woche|Wochen|Monat|Monate)/); if (!m) return null;
  const n = new Date(d), v = +m[1];
  if (/Woche/.test(m[2])) n.setDate(n.getDate() - 7 * v); else n.setMonth(n.getMonth() - v);
  return n;
}
function daysTo(d) { return d ? Math.round((d - today0()) / 86400000) : null; }
function aboEntries() { return S.data.entries.filter(e => e.abo && e.abo.active); }
function aboHints() {
  const out = [];
  aboEntries().filter(e => e.abo.status !== "gekündigt").forEach(e => {
    const nb = noticeBy(e.abo), dn = daysTo(nb), nd = nextDue(e.abo), dd = daysTo(nd);
    if (nb && dn >= 0 && dn <= 30) out.push({ e, kind: "kuend", days: dn, date: nb, text: `Kündigen bis ${fmtD(nb)} (${dn === 0 ? "heute" : "in " + dn + " Tag" + (dn === 1 ? "" : "en")}), sonst Verlängerung am ${fmtD(nd)}` });
    else if (nd && dd >= 0 && dd <= 30) out.push({ e, kind: "verl", days: dd, date: nd, text: `Verlängert sich am ${fmtD(nd)} (${dd === 0 ? "heute" : "in " + dd + " Tag" + (dd === 1 ? "" : "en")}) · ${money(e.abo.cost, e.abo.currency)}` });
  });
  return out.sort((a, b) => a.days - b.days);
}
function aboSums() {
  const m = {};
  aboEntries().filter(e => e.abo.status !== "gekündigt").forEach(e => { const c = e.abo.currency || "CHF"; m[c] = (m[c] || 0) + perMonth(e.abo); });

function nlDoc() {

  if (!d._nl) { try { d._nl = JSON.parse(d.nachlass || "{}") || {}; } catch (e) { d._nl = {}; } }

  n.person = n.person || {}; n.vertrauen = n.vertrauen || {}; n.pw = n.pw || {}; n.rows = n.rows || []; n.devices = n.devices || {};
  return n;
}

let nlTimer = null, nlQueue = Promise.resolve();
function nlEnqueue(fn) {
  const p = nlQueue.then(fn).catch(e => toast(errText(e)));
  nlQueue = p;
  return p;
}
function nlSaveDoc() {
  clearTimeout(nlTimer);
  nlTimer = setTimeout(() => nlEnqueue(async () => {
    const doc = nlDoc(); doc.updated = new Date().toISOString();
    setData(await api.saveNachlass(JSON.stringify(doc)));
  }), 300);
}
function nlAutoSection(e) {

  const c = catName(e.categoryId).toLowerCase();
  if (/mail|messenger/.test(c)) return "email";
  if (/bank|finanz|zahl/.test(c)) return "finance";
  if (/social|netzwerke/.test(c)) return "social";
  if (/cloud|foto/.test(c)) return "cloud";
  if (/hosting|domain/.test(c)) return "web";
  return "shop";
}
function nlAutoInclude(e) { return !/windows|wlan|netzwerk/.test(catName(e.categoryId).toLowerCase()) && !/^wlan /i.test(e.title || ""); }

function nlIncluded(e) { const i = e.nachlass && e.nachlass.include; return i === "ja" || (i !== "nein" && nlAutoInclude(e)); }
function pcLabel(pc) {
  const f = k => ((pc.fields || []).find(x => x.key === k) || {}).value || "";

// Alle Zeilen eines Abschnitts: Passwort-Einträge, PCs, eigene Zeilen
function nlRows(sec) {
  const doc = nlDoc(), out = [];
  S.data.entries.filter(e => nlSection(e) === sec.id).forEach(e => {
    const n = e.nachlass || {}, a = e.abo && e.abo.active ? e.abo : null;
    out.push({ kind: "entry", key: e.id, dienst: e.title, benutzer: e.userName || "", anbieter: hostOf(e.url), twofa: n.twofa || "", action: n.action || "", note: n.note || "",
      auto: a ? [a.payment, a.cost ? money(a.cost, a.currency) + "/" + aboInt(a)[2] : ""].filter(Boolean).join(" · ") : "", inc: nlIncluded(e), sectionSet: !!n.section });
  });
  if (sec.devices) S.data.pcs.forEach(pc => {
    const n = doc.devices[pc.id] || {}, l = pcLabel(pc);
    out.push({ kind: "pc", key: pc.id, dienst: l.name, benutzer: n.benutzer != null ? n.benutzer : l.user, twofa: n.twofa || "", action: n.action || "", note: n.note || "", inc: n.include !== "nein" });
  });
  doc.rows.filter(r => r.section === sec.id).forEach(r => out.push({ kind: "row", key: r.id, dienst: r.dienst || "", benutzer: r.benutzer || "", anbieter: r.anbieter || "", twofa: r.twofa || "", action: r.action || "", note: r.note || "", inc: true }));

}

}

// Lokale Nachlass-Angaben pro Eintrag (gelten sofort, auch bevor gespeichert ist)
const nlLocal = {};
function nlEntrySave(id, patch) {
  const e = S.data.entries.find(x => x.id === id); if (!e) return Promise.resolve();
  nlLocal[id] = Object.assign({ include: "", section: "", action: "", twofa: "", note: "" }, e.nachlass || {}, nlLocal[id] || {}, patch);
  e.nachlass = Object.assign({}, nlLocal[id]);
  return nlEnqueue(async () => {
    const cur = S.data.entries.find(x => x.id === id) || e, sent = nlLocal[id];
    if (!sent) return;
    const r = await api.saveEntry(Object.assign({}, cur, { nachlass: sent, modified: "" }));
    setData(r.data);
    if (nlLocal[id] === sent) delete nlLocal[id];
    // noch nicht gespeicherte lokale Änderungen anderer Einträge erhalten
    S.data.entries.forEach(x => { if (nlLocal[x.id]) x.nachlass = Object.assign({}, nlLocal[x.id]); });
  });
}
function bindNachlass() {
  const root = $("#nl"); if (!root) return;
  root.addEventListener("change", async ev => {
    const el = ev.target;
    try {
      if (el.dataset.doc) {
        const [a, b] = el.dataset.doc.split("."), doc = nlDoc();
        doc[a] = doc[a] || {}; doc[a][b] = el.value.trim(); return nlSaveDoc();
      }
      const f = el.dataset.f, tr = el.closest("tr"); if (!f || !tr) return;
      const kind = tr.dataset.kind, key = tr.dataset.key;
      const val = f === "include" ? (el.checked ? "ja" : "nein") : el.value.trim();
      if (kind === "entry") {
        const p = nlEntrySave(key, { [f]: val });
        if (f === "include" || f === "section") rerenderContent();
        await p;
      } else if (kind === "pc") {
        const doc = nlDoc(); doc.devices[key] = Object.assign({}, doc.devices[key] || {}, { [f]: val }); nlSaveDoc();
        if (f === "include") tr.classList.toggle("off", val === "nein");
      } else {
        const row = nlDoc().rows.find(r => r.id === key); if (row) { row[f] = val; nlSaveDoc(); }
      }
    } catch (e) { toast(errText(e)); }
  });
}
function nlAddRow(sec, dienst) {
  const doc = nlDoc();
  doc.rows.push({ id: Math.random().toString(36).slice(2, 10), section: sec, dienst: dienst || "" });
  nlSaveDoc(); rerenderContent();
  if (!dienst) { const ins = document.querySelectorAll(`.nlsec[data-sec="${sec}"] tr[data-kind=row] [data-f=dienst]`); if (ins.length) ins[ins.length - 1].focus(); }
}

  const today = new Date().toLocaleDateString("de-CH");
  const tables = NL.map(sec => {
    const rows = nlRows(sec).filter(r => r.inc);
    const head = sec.web ? ["Domain", "Anbieter", "Anmeldung", "Was tun?", sec.note] : [sec.devices ? "Gerät" : "Dienst", sec.user, "2FA", "Was tun?", sec.note];
    const cells = r => sec.web ? [r.dienst, r.anbieter, r.benutzer, r.action, r.note] : [r.dienst, r.benutzer, r.twofa, r.action, [r.auto, r.note].filter(Boolean).join(" · ")];
    const body = rows.map(r => `<tr>${cells(r).map(c => `<td>${esc(c || "")}</td>`).join("")}</tr>`).join("") + `<tr class="blank">${head.map(() => "<td>&nbsp;</td>").join("")}</tr>`.repeat(2);

    <div class="pr-sec"><h2>Passwörter</h2><table>${line("Passwort-Manager", w.manager || "StickTresor (KeePass-Datei daten.kdbx auf dem USB-Stick)")}${w.stick ? line("Aufbewahrungsort USB-Stick", w.stick) : ""}${line("Aufbewahrungsort Master-Passwort", w.master)}${line("Aufbewahrungsort Wiederherstellungsschlüssel", w.rec)}${line("Aufbewahrungsort physische Zugangsdaten", w.physisch)}${line("Zugang 2FA-Gerät / Smartphone-PIN", w.zweiFA)}${w.notizen ? line("Weitere Notizen", w.notizen) : ""}</table>
      <p class="small">Die Datei daten.kdbx kann auch mit KeePass, KeePassXC (PC), KeePassDX (Android) oder Strongbox (iPhone) und dem Master-Passwort geöffnet werden.</p></div>
    ${tables}
    <div class="pr-sec nl-sign"><h2>Bestätigung und Gültigkeit</h2><p>Dieses Dokument entspricht meinem ausdrücklichen Willen bezüglich meines digitalen Nachlasses.</p>

function updBox() {

  if (u.error) return `<div class="err">${esc(u.error)}</div><div class="row"><button class="btn" data-act="upd-check">Nochmals versuchen</button></div>`;

// ---------- Dialoge ----------
function dialog(html, onBind, wide) {
  closeDialog();
  const o = document.createElement("div");
  o.className = "overlay"; o.id = "dlg";
  o.innerHTML = `<div class="dialog${wide ? " " + (wide === true ? "wide" : wide) : ""}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(o);
  o.addEventListener("mousedown", ev => { if (ev.target === o) closeDialog(); });
  o.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeDialog));
  if (onBind) onBind(o);
  const f = o.querySelector("[autofocus]") || o.querySelector("input,select,textarea,button"); if (f) f.focus();
  return o;
}
function closeDialog() { const d = $("#dlg"); if (d) d.remove(); }
function dlgMsg(text) { const m = $("#dlg-msg"); if (m) m.innerHTML = text ? `<div class="err">${esc(text)}</div>` : ""; }
function confirmDlg(title, text, okLabel, danger) {
  return new Promise(res => {
    dialog(`<h2>${esc(title)}</h2><div style="color:#4A4450">${text}</div>
      <div class="acts"><button class="btn" data-close>Abbrechen</button><button class="btn ${danger ? "danger" : "p"}" id="dlg-ok">${esc(okLabel)}</button></div>`,
      o => { o.querySelector("#dlg-ok").addEventListener("click", () => { closeDialog(); res(true); }); o.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => res(false))); });
  });
}
function promptDlg(title, label, value) {
  return new Promise(res => {
    dialog(`<h2>${esc(title)}</h2><form id="pf" class="stack"><div><label class="lbl" for="pv">${esc(label)}</label><input id="pv" class="field" value="${esc(value || "")}" autofocus></div>
      <div id="dlg-msg"></div><div class="acts"><button class="btn" type="button" data-close>Abbrechen</button><button class="btn p" type="submit">OK</button></div></form>`,
      o => {
        o.querySelector("#pf").addEventListener("submit", ev => { ev.preventDefault(); const v = o.querySelector("#pv").value.trim(); if (!v) return; closeDialog(); res(v); });
        o.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => res(null)));
      });
  });
}

function genPassword(len, sym) {
  const sets = ["ABCDEFGHJKLMNPQRSTUVWXYZ", "abcdefghijkmnopqrstuvwxyz", "23456789"];
  if (sym) sets.push("!#$%&*+-=?@_");
  const all = sets.join("");
  const rnd = n => { const a = new Uint32Array(1); const lim = Math.floor(0x100000000 / n) * n; let x; do { crypto.getRandomValues(a); x = a[0]; } while (x >= lim); return x % n; };
  let out;
  do {
    out = ""; for (let i = 0; i < len; i++) out += all[rnd(all.length)];
  } while (!sets.every(s => [...out].some(c => s.includes(c))));
  return out;
}

        ev.preventDefault();
        const e = { id: entry.id || "", categoryId: o.querySelector("#e-cat").value, title: o.querySelector("#e-title").value, userName: o.querySelector("#e-user").value,
          password: pw.value, url: o.querySelector("#e-url").value, notes: o.querySelector("#e-notes").value, devices: [...o.querySelectorAll(".e-dev:checked")].map(i => i.value), modified: "",
          nachlass: { include: o.querySelector("#e-nl-inc").value, section: o.querySelector("#e-nl-sec").value, action: o.querySelector("#e-nl-act").value, twofa: o.querySelector("#e-nl-2fa").value, note: o.querySelector("#e-nl-note").value.trim() } };
        try { const r = await api.saveEntry(e); S.data = r.data; closeDialog(); toast("Gespeichert."); render(); }
        catch (err) { dlgMsg(errText(err)); }
      });
      const del = o.querySelector("#e-del");
      if (del) del.addEventListener("click", async () => {
        if (!await confirmDlg("Eintrag löschen?", "«" + esc(entry.title) + "» wird endgültig gelöscht.", "Löschen", true)) { entryDialog(entry); return; }
        try { S.data = await api.deleteEntry(entry.id); S.shown.delete(entry.id); toast("Gelöscht."); render(); } catch (err) { toast(errText(err)); }
      });
    });
}

function catManageDialog() {
  const draw = o => {
    const list = S.data.categories.filter(c => !c.device && !c.root);
    o.querySelector("#cm-list").innerHTML = list.map(c => `<div class="catrow" data-id="${esc(c.id)}">
        <input class="field" value="${esc(c.name.split(" / ").pop())}" aria-label="Name der Kategorie" style="flex:1">
        <span class="small muted" style="width:76px;text-align:right">${c.count} Eintr${c.count === 1 ? "ag" : "äge"}</span>
        <button class="cbtn" data-cm="del" title="${c.count ? "Erst leeren, dann löschen" : "Löschen"}" aria-label="Löschen" ${c.count ? "disabled style=\"opacity:.35\"" : ""}>${I.trash}</button></div>`).join("");
    o.querySelectorAll(".catrow input").forEach(inp => inp.addEventListener("change", async () => {
      const id = inp.closest(".catrow").dataset.id;
      try { S.data = await api.renameCategory(id, inp.value); dlgMsg(""); toast("Umbenannt."); } catch (e) { dlgMsg(errText(e)); }
    }));
    o.querySelectorAll('[data-cm="del"]').forEach(b => b.addEventListener("click", async () => {
      const id = b.closest(".catrow").dataset.id;
      try { S.data = await api.deleteCategory(id); if (S.catId === id) S.catId = "all"; draw(o); } catch (e) { dlgMsg(errText(e)); }
    }));
  };
  dialog(`<h2>Kategorien bearbeiten</h2>
    <div class="small muted">Namen direkt ändern. Leere Kategorien lassen sich löschen. Geräte werden pro Eintrag in der Spalte «Kategorie · Geräte» angekreuzt.</div>
    <div id="cm-list" class="stack" style="gap:8px"></div>
    <form id="cm-add" class="catrow" style="margin-top:6px"><input id="cm-new" class="field" placeholder="Neue Kategorie, z.B. Banking, Lieferanten, Kamera …" style="flex:1" aria-label="Neue Kategorie"><button class="btn p" type="submit">${I.plus} Hinzufügen</button></form>
    <div id="dlg-msg"></div>
    <div class="acts"><button class="btn p" data-close id="cm-done">Fertig</button></div>`, o => {
    draw(o);
    o.querySelector("#cm-add").addEventListener("submit", async ev => {
      ev.preventDefault();
      const n = o.querySelector("#cm-new").value.trim(); if (!n) return;
      try { const r = await api.addCategory(n); S.data = r.data; o.querySelector("#cm-new").value = ""; dlgMsg(""); draw(o); o.querySelector("#cm-new").focus(); } catch (e) { dlgMsg(errText(e)); }
    });
    o.querySelector("#cm-done").addEventListener("click", () => rerenderContent());
  });
  const ov = $("#dlg"); if (ov) ov.addEventListener("mousedown", ev => { if (ev.target === ov) rerenderContent(); });
}
