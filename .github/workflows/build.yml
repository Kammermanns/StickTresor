# Baut und testet bei jedem Push. Wird auf GitHub ein Release veröffentlicht (Tag v*, z.B. v4.1.0),
# hängt der Bau StickTresor.exe und StickTresor.exe.sha256 an (für die Update-Funktion der App).
# Signiert wird mit SignPath (siehe CODE_SIGNING.md), sobald es eingerichtet ist.
name: Build
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Tests
        run: go test -mod=vendor ./internal/...
      - name: Version bestimmen
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "v=0.0.0-dev" >> "$GITHUB_OUTPUT"; fi
      - name: Versionsangaben in die Exe (Produktname, Version, Icon, Manifest)
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
          V="${{ steps.ver.outputs.v }}"; N="${V%%-*}"; IFS=. read -r MA MI PA <<< "$N"
          "$(go env GOPATH)/bin/goversioninfo" -64 -o rsrc_windows_amd64.syso \
            -file-version "$V" -product-version "$V" \
            -ver-major "${MA:-0}" -ver-minor "${MI:-0}" -ver-patch "${PA:-0}" -ver-build 0 \
            -product-ver-major "${MA:-0}" -product-ver-minor "${MI:-0}" -product-ver-patch "${PA:-0}" -product-ver-build 0 \
            build/versioninfo.json
      - name: Windows-Exe bauen
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -mod=vendor -trimpath -ldflags "-s -w -H windowsgui -X github.com/Kammermanns/StickTresor/internal/app.Version=${{ steps.ver.outputs.v }}" -o StickTresor.exe .
          sha256sum StickTresor.exe > StickTresor.exe.sha256
      - name: Unsigniertes Programm bereitstellen
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: StickTresor-unsigniert
          path: StickTresor.exe
      # Signieren mit SignPath (kostenlos für Open Source, Zertifikat der SignPath Foundation).
      # Läuft nur bei einem veröffentlichten Release und sobald die Repository-Variable
      # SIGNPATH_ORGANIZATION_ID und das Secret SIGNPATH_API_TOKEN eingerichtet sind.
      # Jede Signatur muss in SignPath von Hand freigegeben werden.
      - name: Signieren (SignPath)
        id: sign
        if: github.event_name == 'release' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'StickTresor' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(steps.ver.outputs.v) }}
      - name: Signierte Exe übernehmen
        if: steps.sign.outcome == 'success'
        run: |
          cp signed/StickTresor.exe StickTresor.exe
          sha256sum StickTresor.exe > StickTresor.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: StickTresor
          path: |
            StickTresor.exe
            StickTresor.exe.sha256
      - name: Release
        if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            StickTresor.exe
            StickTresor.exe.sha256
