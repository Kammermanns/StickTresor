  dialog(`<h2>Master-Passwort ändern</h2><form id="cf" class="stack">
    <div><label class="lbl" for="c-old">Bisheriges Passwort</label><input id="c-old" class="field" type="password" autofocus></div>
    <div><label class="lbl" for="c-new">Neues Passwort</label><input id="c-new" class="field" type="password"></div>
    <div><label class="lbl" for="c-rep">Neues Passwort wiederholen</label><input id="c-rep" class="field" type="password"></div>
    <div class="small muted">Der ausgedruckte Wiederherstellungsschlüssel bleibt gültig.</div>
    <div id="dlg-msg"></div>
    <div class="acts"><button class="btn" type="button" data-close>Abbrechen</button><button class="btn p" type="submit">Ändern</button></div></form>`, o => {
    o.querySelector("#cf").addEventListener("submit", async ev => {
      ev.preventDefault();
      const a = o.querySelector("#c-new").value;
      if (a !== o.querySelector("#c-rep").value) return dlgMsg("Die neuen Passwörter stimmen nicht überein.");
      try { await run("Wird gespeichert …", () => api.changeMaster(o.querySelector("#c-old").value, a)); closeDialog(); toast("Master-Passwort geändert."); }
      catch (err) { dlgMsg(errText(err)); }
    });
  });
}

function newRecDialog() {
  dialog(`<h2>Neuer Wiederherstellungsschlüssel</h2><form id="nf" class="stack">
    <div class="warn">Der bisherige ausgedruckte Schlüssel wird damit ungültig.</div>
    <div><label class="lbl" for="n-pw">Master-Passwort zur Bestätigung</label><input id="n-pw" class="field" type="password" autofocus></div>
    <div id="dlg-msg"></div>
    <div class="acts"><button class="btn" type="button" data-close>Abbrechen</button><button class="btn p" type="submit">Erzeugen</button></div></form>`, o => {
    o.querySelector("#nf").addEventListener("submit", async ev => {
      ev.preventDefault();
      try {
        const key = await run("Wird gespeichert …", () => api.newRecoveryKey(o.querySelector("#n-pw").value));
        dialog(`<h2>Ihr neuer Wiederherstellungsschlüssel</h2><div class="keybox"><div class="key mono">${esc(key)}</div>
          <div class="small">Bitte ausdrucken und sicher aufbewahren, nicht zusammen mit dem Stick.</div></div>
          <div class="acts"><button class="btn" id="k-print">${I.print} Drucken</button><button class="btn p" data-close>Fertig</button></div>`,
          o2 => o2.querySelector("#k-print").addEventListener("click", () => printKey(key)));
      } catch (err) { dlgMsg(errText(err)); }
    });
  });
}

// ---------- Drucken ----------
function printPCs(pcs) {
  const secs = S.data.sections, known = knownKeys();
  const now = new Date();
  const stamp = now.toLocaleDateString("de-CH") + " " + now.toLocaleTimeString("de-CH", { hour: "2-digit", minute: "2-digit" });
  // Fusszeile links pro Gerät: «Gedruckt … · erfasst am …» (benannte Seiten, damit «Alle drucken» stimmt)
  const css = pcs.map((pc, i) => `@page pc${i}{@bottom-left{content:"${cssStr("Gedruckt " + stamp + (fieldVal(pc, "Erfasst am") ? " · erfasst am " + fieldVal(pc, "Erfasst am") : ""))}"}}`).join("\n");
  $("#print").innerHTML = `<style>${css}</style>` + pcs.map((pc, i) => {
    const block = (title, rows) => rows.length ? `<div class="pr-sec"><h2>${esc(title)}</h2><table>${rows.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table></div>` : "";
    let html = `<div class="pr-page" style="page:pc${i}">${prHead()}<div class="pr-title">${esc(pc.name)}</div>`;
    // gleiche Reihenfolge wie in der Ansicht, eine Spalte
    ["left", "right"].forEach(c => secs.filter(s => s.column === c).forEach(s => { html += block(s.title, s.keys.filter(k => k !== WIFI_PW).map(k => [k, fieldVal(pc, k)]).filter(r => r[1])); }));
    html += block("Weitere Felder", pc.fields.filter(f => !known.has(f.key) && f.value).map(f => [f.key, f.value]));
    if (pc.notes) html += `<div class="pr-sec"><h2>Notizen</h2><div class="pr-notes">${esc(pc.notes)}</div></div>`;
    const linked = S.data.entries.filter(e => hasDev(e, pc.name)).sort((a, b) => a.title.localeCompare(b.title, "de"));
    if (linked.length) html += `<div class="pr-sec pr-pw"><h2>Zugehörige Passwörter <span style="color:#555;font-weight:400;font-size:9pt">· vertraulich aufbewahren</span></h2><table><tr><th>Bezeichnung</th><th>Benutzer</th><th>Passwort</th><th>Notizen</th></tr>${linked.map(e =>
      `<tr><td>${esc(e.title)}</td><td>${esc(e.userName)}</td><td class="pr-mono">${esc(e.password)}</td><td style="white-space:pre-line">${esc(e.notes)}</td></tr>`).join("")}</table></div>`;
    html += `</div>`;
    return html;
  }).join("");
  setTimeout(() => window.print(), 50);
}
function cssStr(t) { return String(t).replace(/\\/g, "\\\\").replace(/"/g, '\\"').replace(/\n/g, " "); }
function prHead() {
  if (!P) return `<div class="pr-head"><div class="pr-addr"><b>${esc(appTitle())}</b></div><img src="${logo()}" alt=""></div>`;
  const l2 = [P.strasse, P.ort].filter(Boolean).map(esc).join(" · "), l3 = [P.tel, P.mail, P.web].filter(Boolean).map(esc).join(" · ");
  return `<div class="pr-head"><div class="pr-addr"><b>${esc(P.firma)}</b>${l2 ? "<br>" + l2 : ""}${l3 ? "<br>" + l3 : ""}</div><img src="${logo()}" alt=""></div>`;
}
function printKey(key) {
  const d = new Date().toLocaleDateString("de-CH");
  $("#print").innerHTML = `<style>@page{@bottom-left{content:"Erstellt am ${d}"}}</style><div class="pr-page">${prHead()}<div class="pr-title">Wiederherstellungsschlüssel</div>
    <p>Mit diesem Schlüssel öffnen Sie Ihre Daten, falls Sie das Master-Passwort vergessen haben: In der App auf «Passwort vergessen?» klicken und den Schlüssel eingeben.</p>
    <div class="pr-key">${esc(key)}</div>
    <p><b>Bitte sicher aufbewahren</b>, zum Beispiel im Tresor oder bei wichtigen Unterlagen, aber <b>nicht zusammen mit dem USB-Stick</b>. Wer diesen Schlüssel und den Stick hat, kann alle Passwörter lesen.</p>
    <p>Erstellt am ${new Date().toLocaleDateString("de-CH")}</p></div>`;
  setTimeout(() => window.print(), 50);
}

// ---------- Ereignisse ----------
function bind() {
  const on = (sel, ev, fn) => { const el = $(sel); if (el) el.addEventListener(ev, fn); };
  const msg = t => { const m = $("#msg"); if (m) m.innerHTML = t ? `<div class="err">${esc(t)}</div>` : ""; };

  on("#f-new", "submit", async ev => {
    ev.preventDefault();
    const pw = $("#pw").value;
    if (pw !== $("#pw2").value) return msg("Die beiden Passwörter stimmen nicht überein.");
    try { await run("Tresor wird angelegt …", () => api.create(pw, false)); S.view = "home"; await refresh(); }
    catch (e) { msg(errText(e)); }
  });
  on("#f-login", "submit", async ev => {
    ev.preventDefault();
    const pw = $("#pw").value; if (!pw) return;
    try { await run("Wird entsperrt …", () => api.unlock(pw)); S.view = "home"; S.pcId = null; S.catId = "all"; S.q = ""; await refresh(); }
    catch (e) { msg(errText(e)); const f = $("#pw"); f.value = ""; f.focus(); }
  });
  on("#f-rec", "submit", async ev => {
    ev.preventDefault();
    try { await run("Wird geprüft …", () => api.recover($("#rk").value)); S.loginMode = "pw"; await refresh(); }
    catch (e) { msg(errText(e)); }
  });
  on("#np1", "input", updateMeter);
  on("#f-setpw", "submit", async ev => {
    ev.preventDefault();
    const a = $("#np1").value, b = $("#np2").value;
    if (a.length < 6) return msg("Das Passwort muss mindestens 6 Zeichen lang sein.");
    if (a !== b) return msg("Die beiden Passwörter stimmen nicht überein.");
    const ck = $("#ck"); if (ck && !ck.checked) return msg("Bitte bestätigen, dass Sie den Wiederherstellungsschlüssel ausgedruckt haben.");
    try { await run("Wird verschlüsselt und gespeichert …", () => api.setMaster(a)); S.view = "home"; S.pcId = null; await refresh(); toast("Master-Passwort gespeichert. Nur Sie haben jetzt Zugriff."); }
    catch (e) { msg(errText(e)); }
  });
  bindSearch();
  bindGrid();
  bindNachlass();
  on("#s-lock", "change", ev => { setLockMin(+ev.target.value); toast("Gespeichert."); });
  bindActs(document);
}

// Suchfeld: Liste neu aufbauen, Fokus und Cursor behalten
function bindSearch() {
  const s = $("#search"); if (!s) return;
  s.addEventListener("input", async ev => {
    S.q = ev.target.value; const pos = ev.target.selectionStart;
    await settleGrid();
    if (S.q !== ev.target.value) return;
    $("#content").innerHTML = viewPw(); bindActs($("#content")); bindSearch(); bindGrid();
    const n = $("#search"); n.focus(); n.setSelectionRange(pos, pos);
  });
}

function bindActs(root) {
  root.querySelectorAll("[data-act]").forEach(el => el.addEventListener("click", ev => { ev.preventDefault(); ev.stopPropagation(); act(el.dataset.act, el.dataset.id, el); }));
}

async function act(a, id, el) {
  if (a !== "row-add" && $("#gbody")) await settleGrid();
  const d = S.data;
  try {
    switch (a) {
      case "login-rec": S.loginMode = "rec"; return render();
      case "login-pw": S.loginMode = "pw"; return render();
      case "print-key": return printKey(S.status.recoveryKey);
      case "lock": await api.lock(); return refresh();
      case "quit": await api.quit(); return;
      case "new-self": await run("Tresor wird angelegt …", () => api.create("", true)); return refresh();
      case "partner-edit": return partnerDialog();
      case "nl-print": return printNachlass();
      case "nl-add": return nlAddRow(id);
      case "nl-sugg": { const [sec, name] = id.split("|"); return nlAddRow(sec, name); }
      case "nl-more": S.nlMore = S.nlMore || {}; S.nlMore[id] = !S.nlMore[id]; return rerenderContent();
      case "nl-del": { const doc = nlDoc(); doc.rows = doc.rows.filter(r => r.id !== id); nlSaveDoc(); return rerenderContent(); }
      case "upd-check": {
        try { S.update = await run("Suche nach Updates …", () => api.checkUpdate()); } catch (e) { S.update = { error: errText(e) }; }
        const box = $("#upd"); if (box) box.innerHTML = updBox(); return;
      }
      case "upd-install": {
        if (!await confirmDlg("Jetzt aktualisieren?", `Version ${esc(S.update.latest)} wird geladen und geprüft. Danach startet die App neu. Ihre Daten werden vorher gesichert und nicht verändert.`, "Aktualisieren")) return;
        await run("Update wird geladen und geprüft …", () => api.installUpdate());
        return;
      }
      case "prepare-stick": return prepareStick();
      case "go": S.view = id; S.editPc = null; if (id === "pw") { S.q = ""; S.catId = "all"; S.devF = ""; S.secF = ""; } window.scrollTo(0, 0); return render();
      case "url": return api.openURL(id);
      case "abof": S.aboF = id; return rerenderContent();
      case "abo-new": return aboDialog({}, true);
      case "abo-edit": { const en = d.entries.find(e => e.id === id); if (en) aboDialog(en, false); return; }
      case "abo-print": return printAbosDialog();
      case "abo-login": { const en = d.entries.find(e => e.id === id); S.view = "pw"; S.catId = "all"; S.devF = ""; S.secF = ""; S.q = en ? en.title : ""; return render(); }
      case "help-jump": { const el = document.getElementById("h-" + id); if (el) { el.open = true; el.scrollIntoView({ behavior: "smooth", block: "start" }); } return; }
      case "pc": S.view = "pc"; S.pcId = id; S.editPc = null; window.scrollTo(0, 0); return render();
      case "cat": S.view = "pw"; S.catId = id; S.q = ""; S.editPc = null; return render();
      case "capture": {
        const r = await run("Dieser PC wird ausgelesen … Das dauert etwa 10 bis 30 Sekunden.", () => api.capturePC());
        S.data = r.data; S.view = "pc"; S.pcId = r.id; S.editPc = null; render();
        return toast((r.created ? "Dieser PC wurde erfasst: " + r.name + "." : "Seriennummer bekannt: " + r.name + " wurde aktualisiert. Ergänzungen bleiben erhalten.")
          + (r.wifi ? " Das WLAN «" + r.wifi + "» wurde unter Passwörter abgelegt." : ""));
      }
      case "pc-edit": { const pc = curPC(); S.editPc = JSON.parse(JSON.stringify(pc)); return render(); }
      case "pc-cancel": S.editPc = null; return render();
      case "own-add": { const w = document.createElement("div"); w.innerHTML = ownRow("", ""); const r = w.firstChild; $("#own").appendChild(r); bindActs(r); r.querySelector(".own-k").focus(); return; }
      case "own-del": return el.closest(".own").remove();
      case "pc-save": {
        let pc; try { pc = collectPCEdit(); } catch (e) { $("#msg").innerHTML = `<div class="err">${esc(e)}</div>`; return; }
        if (!pc.name) { $("#msg").innerHTML = '<div class="err">Der PC-Name darf nicht leer sein.</div>'; return; }
        S.data = await api.savePC(pc); S.editPc = null; render(); return toast("Gespeichert.");
      }
      case "pc-delete": {
        const pc = curPC();
        if (!await confirmDlg("PC löschen?", "Das Datenblatt «" + esc(pc.name) + "» wird gelöscht. Passwörter bleiben erhalten.", "Löschen", true)) return;
        S.data = await api.deletePC(pc.id); S.editPc = null; S.pcId = null; S.view = "devices"; render(); return toast("Gerät gelöscht.");
      }
      case "pc-print": return printPCs([curPC()]);
      case "print-all": return printPCs(d.pcs);
      case "entry-new": return entryDialog({});
      case "row-add": return addRow();
      case "import": return importDialog("");
      case "sort": { const k = id; S.sort = S.sort && S.sort.k === k ? { k, dir: -S.sort.dir } : { k, dir: 1 }; return rerenderContent(); }
      case "entry-new-pc": { const pc = curPC(); const c = d.categories.find(c => /windows/i.test(c.name)); return entryDialog({ title: "Windows-Anmeldung", categoryId: c ? c.id : "", devices: [pc.name] }); }
      case "devf": S.view = "pw"; S.devF = id || ""; S.q = ""; return render();
      case "secf": S.view = "pw"; S.secF = S.secF === id ? "" : (id || ""); S.q = ""; return render();
      case "cat-manage": return catManageDialog();
      case "entry-edit": return entryDialog(d.entries.find(e => e.id === id));
      case "pw-show": S.shown.has(id) ? S.shown.delete(id) : S.shown.add(id); return rerenderContent();
      case "pw-copy": { const e = d.entries.find(e => e.id === id); await api.copy(e.password); return toast("Passwort kopiert. Die Zwischenablage wird in 30 Sekunden geleert."); }
      case "user-copy": { const e = d.entries.find(e => e.id === id); await api.copy(e.userName); return toast("Benutzername kopiert."); }
      case "cat-add": {
        const n = await promptDlg("Neue Kategorie", "Name", ""); if (!n) return;
        const r = await api.addCategory(n); S.data = r.data; S.view = "pw"; S.catId = r.id; S.q = ""; return render();
      }
      case "cat-rename": {
        const c = d.categories.find(c => c.id === S.catId); const n = await promptDlg("Kategorie umbenennen", "Name", c.name.split(" / ").pop()); if (!n) return;
        S.data = await api.renameCategory(c.id, n); return render();
      }
      case "cat-delete": {
        const c = d.categories.find(c => c.id === S.catId);
        if (!await confirmDlg("Kategorie löschen?", "«" + esc(c.name) + "» wird gelöscht. Das geht nur, wenn sie leer ist.", "Löschen", true)) return;
        S.data = await api.deleteCategory(c.id); S.catId = "all"; return render();
      }
      case "handover": {
        const ok = await confirmDlg("An den Kunden übergeben?",
          `Beim nächsten Start muss der Kunde ein eigenes Master-Passwort festlegen. Ihr Übergabe-Passwort funktioniert danach nicht mehr und der Knopf «Passwort setzen» verschwindet.
           <div class="info" style="margin-top:12px">Erfasst: <b>${d.pcs.length} PC${d.pcs.length === 1 ? "" : "s"} · ${d.entries.length} Passwörter</b>. Dieser Schritt lässt sich nicht rückgängig machen.</div>`, "Jetzt übergeben");
        if (!ok) return;
        await run("Wird gespeichert …", () => api.handover());
        return refresh();
      }
      case "change-master": return changeMasterDialog();
      case "new-rec": return newRecDialog();
      case "open-folder": return api.openFolder();
      case "backup": { const n = await api.backup(); return toast("Sicherung erstellt: Backup\\" + n); }
      case "backup-to": { const p = await api.backupTo(); if (p) toast("Sicherung gespeichert: " + p); return; }
    }
  } catch (e) { toast(errText(e)); }
}

function rerenderContent() {
  const c = $("#content"); if (!c) return render();
  closePopover();
  c.innerHTML = viewContent();
  bindActs(c); bindSearch(); bindGrid(); bindNachlass();
}

// ---------- Automatische Sperre ----------
function getLockMin() { try { const v = +localStorage.getItem("st-lock-min"); return v > 0 ? v : 5; } catch (e) { return 5; } }
function setLockMin(v) { try { localStorage.setItem("st-lock-min", String(v)); } catch (e) {} }
let lastActive = Date.now();
["mousemove", "mousedown", "keydown", "wheel", "touchstart"].forEach(t => window.addEventListener(t, () => { lastActive = Date.now(); }, { passive: true }));
setInterval(async () => {
  if (!S.status || S.status.state !== "open") return;
  if (Date.now() - lastActive > getLockMin() * 60000) {
    lastActive = Date.now();
    try { await settleGrid(); } catch (e) {}
    try { await api.lock(); } catch (e) {}
    S.loginMode = "pw"; await refresh(); toast("Automatisch gesperrt.");
  }
}, 10000);

document.addEventListener("keydown", ev => { if (ev.key === "Escape") { closePopover(); closeDialog(); } });

window.addEventListener("DOMContentLoaded", () => { render(); refresh(); });
if (document.readyState !== "loading") { render(); refresh(); }
</script>
